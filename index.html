<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ski Lease Rooms</title>
<meta name="description" content="MIP bed assignment for a ski lease, with a season simulation against first come.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #efeeea;
  --border: #e2e1dc;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #0f8a5f;
  --accent-ink: #ffffff;
  --opt: #0f8a5f;
  --fc: #bdbcb5;
  --couple: #6250d6;
  --single: #0f8a5f;
  --guest: #b56d00;
  --grid: #e7e6e1;
  --warn-bg: #fff4dc;
  --warn-ink: #6b4a00;
  --empty: #efeeea;
  --bed: #ffffff;
  --bed-free: #f6f6f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --border: #33332f;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --accent: #199e70;
    --accent-ink: #ffffff;
    --opt: #199e70;
    --fc: #4a4945;
    --couple: #9085e9;
    --single: #199e70;
  --guest: #c98500;
    --guest: #c98500;
    --grid: #2c2c29;
    --warn-bg: #3a2e12;
    --warn-ink: #f3d79a;
    --empty: #232321;
    --bed: #262624;
    --bed-free: #1e1e1d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211;
  --surface: #1a1a19;
  --surface-2: #232321;
  --border: #33332f;
  --text: #f0efec;
  --text-2: #c3c2b7;
  --text-3: #8f8e86;
  --accent: #199e70;
  --accent-ink: #ffffff;
  --opt: #199e70;
  --fc: #4a4945;
  --couple: #9085e9;
  --single: #199e70;
  --grid: #2c2c29;
  --warn-bg: #3a2e12;
  --warn-ink: #f3d79a;
  --empty: #232321;
  --bed: #262624;
  --bed-free: #1e1e1d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 12px 16px 40px; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
.small { font-size: 11.5px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
header .meta { color: var(--text-3); }
nav.tabs { display: flex; gap: 2px; margin: 8px 0 10px; border-bottom: 1px solid var(--border); }
nav.tabs button { appearance: none; border: 0; background: none; color: var(--text-2); font: inherit; font-weight: 500; padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
section.panel { display: none; }
section.panel.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 6px; }
.card h3 { font-size: 12.5px; margin: 0 0 6px; color: var(--text-2); }
.sub { color: var(--text-3); margin: 4px 0 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.row h2, .row h3 { margin: 0; }
.spacer { flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.setup-grid { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 10px; align-items: start; }
@media (max-width: 1250px) { .setup-grid { grid-template-columns: minmax(0, 1fr); } }
.wk { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 980px) { .cols, .two, .wk { grid-template-columns: minmax(0, 1fr); } }
button.btn { appearance: none; font: inherit; font-weight: 500; padding: 4px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
button.btn:hover { background: var(--surface-2); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn.small { padding: 2px 7px; font-size: 12px; }
button.btn:disabled { opacity: 0.5; cursor: default; }
label.btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-weight: 500; }
label.btn.small { padding: 2px 7px; font-size: 12px; }
input, select { font: inherit; font-size: 12.5px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 2px 4px; }
input[type="number"] { width: 52px; }
input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); vertical-align: middle; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); color: var(--text-2); font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 3px 6px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-weight: 600; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
table.tight td, table.tight th { padding: 2px 5px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
.muted { color: var(--text-3); }
.nw { white-space: nowrap; }
#reg-table td:first-child { white-space: nowrap; }
.status { color: var(--text-3); }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 6px 10px; margin: 0; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.couple, .key.couple { background: var(--couple); }
.dot.single, .key.single { background: var(--single); }
.key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.key.opt { background: var(--opt); }
.key.fc { background: var(--fc); }
.legend { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; color: var(--text-2); margin: 6px 0 4px; }
.legend .key { margin-right: -6px; }

/* Metrics */
table.metrics td { font-variant-numeric: tabular-nums; }
table.metrics td:first-child { white-space: nowrap; }
.wk-cols { grid-template-columns: minmax(250px, auto) minmax(0, 1fr); }
table.metrics td.win { font-weight: 700; }
table.metrics td.unit { font-size: 10.5px; white-space: nowrap; }
table.metrics tr.group td { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); padding-top: 8px; border-bottom: 0; }
td.pct { text-align: center; font-variant-numeric: tabular-nums; border: 2px solid var(--surface); border-radius: 3px; min-width: 30px; }
.gap { border-left: 8px solid var(--surface) !important; }

/* Bed plan */
.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.room { border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px 6px; background: var(--surface-2); }
.room.common { border-style: dashed; }
.room-h { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
.beds { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
.bed { position: relative; background: var(--bed); border: 1px solid var(--border); border-radius: 4px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px; padding: 3px 2px; }
.bed.free { background: var(--bed-free); }
.t-queen, .t-air_queen { width: 62px; height: 42px; }
.t-twin, .t-air_twin { width: 36px; height: 46px; }
.t-bunk_bottom, .t-bunk_top { width: 36px; height: 28px; border-top-width: 3px; }
.t-bunk_top { border-top-style: double; }
.t-couch { width: 70px; height: 26px; border-radius: 8px; }
.t-air_queen, .t-air_twin { border-style: dashed; }
.chip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 18px; border-radius: 9px; font: 600 9.5px/1 Inter, sans-serif; color: #fff; }
.chip.couple { background: var(--couple); }
.chip.single { background: var(--single); }
.chip.guest { background: var(--guest); width: auto; padding: 0 4px; min-width: 22px; }
.chip.sm { width: 14px; height: 14px; min-width: 0; padding: 0; margin-right: 4px; font-size: 9px; }
select.g-sel { font-size: 11.5px; padding: 1px 2px; max-width: 120px; }
table.heat sup { font-size: 8px; margin-left: 1px; }
.chip.held { background: none; border: 1.5px dashed var(--couple); color: var(--couple); }
.legend .chip { margin-right: -6px; }
.bed-key { display: inline-block; width: 16px; height: 12px; background: var(--bed-free); border: 1px solid var(--border); border-radius: 2px; margin-right: -6px; }
details summary { cursor: pointer; color: var(--text-2); margin: 6px 0 4px; font-size: 12px; }

/* Charts and grid */
.chart-box { position: relative; width: 100%; }
table.heat td.cell { text-align: center; font-size: 10.5px; font-variant-numeric: tabular-nums; padding: 2px 1px; min-width: 28px; border: 2px solid var(--surface); border-radius: 3px; }
table.heat td.cell.none { background: var(--empty); }
table.heat th { font-size: 9.5px; text-align: center; padding: 2px 1px; }
table.heat td.name { white-space: nowrap; }
.scale { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-3); margin-top: 6px; }
.scale i { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }

/* Setup */
.settings { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; }
.settings input[type="number"] { width: 70px; }
.bed-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bed-chip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 2px 1px 1px; background: var(--surface-2); }
.bed-chip select, .bed-chip input { border: 0; background: none; padding: 1px 2px; }
.bed-chip input { width: 34px; }
.bed-chip button { border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: 13px; padding: 0 3px; }
input.w-name { width: 120px; }
/* Hover help */
.tipbox { position: fixed; z-index: 50; display: none; max-width: 280px; padding: 6px 9px; border-radius: 6px; background: var(--text); color: var(--surface); font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
[data-tip] { cursor: help; }
.bed[data-tip], .chip[data-tip] { cursor: default; }
.i { color: var(--text-3); font-size: 10px; font-weight: 400; }
.free-n { opacity: 0.7; font-size: 10.5px; margin-left: 2px; }
.set { display: flex; flex-direction: column; gap: 4px; }
.set-l { font-size: 12px; color: var(--text-2); }
pre.model { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 0 0 10px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ski Lease Rooms</h1>
    <span class="mono meta">MIP bed assignment · HiGHS 1.15.3 · priority carried across weekends</span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="weekend" aria-selected="true">Weekend</button>
    <button role="tab" data-tab="season" aria-selected="false">Season</button>
    <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
    <button role="tab" data-tab="model" aria-selected="false">Model</button>
  </nav>

  <section class="panel active" id="panel-weekend">
    <div class="wk">
      <div class="card">
        <div class="row"><h2>Registrations</h2><div class="spacer"></div><div class="seg" id="start-mode" data-tip="Start of season: everyone starts even. Mid-season: priority from 8 simulated weekends."><button data-v="fresh" aria-pressed="true">Start</button><button data-v="mid" aria-pressed="false">Mid-season</button></div></div>
        <div class="row"><span class="mono muted" id="weekend-sub"></span></div>
        <div class="row">
          <button class="btn small" id="btn-random" data-tip="Fill the nights at random from each person's usual attendance.">Random</button>
          <button class="btn small" id="btn-all-sat" data-tip="Everyone registers for Saturday only. This is the busiest case.">All Sat</button>
          <button class="btn small" id="btn-clear">Clear</button>
          <div class="spacer"></div>
          <button class="btn primary" id="btn-assign" disabled>Assign</button>
        </div>
        <div class="row"><span class="status mono" id="weekend-status"></span></div>
        <div class="scroll"><table id="reg-table" class="tight"></table></div>
      </div>
      <div id="weekend-result"></div>
    </div>
  </section>

  <section class="panel" id="panel-season">
    <div class="card">
      <div class="row" style="margin:0">
        <h2>Season · 7 Jan – 2 May 2027</h2>
        <span class="mono muted">17 weekends · same attendance for both methods</span>
        <div class="spacer"></div>
        <span class="status mono" id="season-status"></span>
        <button class="btn primary" id="btn-season">Run</button>
      </div>
    </div>
    <div id="season-result"></div>
  </section>

  <section class="panel" id="panel-setup">
    <div class="card">
      <div class="row"><h2>Optimizer</h2><div class="spacer"></div>
        <button class="btn small" id="btn-export">Export JSON</button>
        <label class="btn small">Import JSON<input type="file" id="file-import" accept="application/json,.json" hidden></label>
        <button class="btn small" id="btn-reset">Reset</button>
      </div>
      <div id="settings"></div>
    </div>
    <div class="setup-grid">
      <div class="card">
        <div class="row"><h2>Rooms</h2><span class="mono muted">couples: queen, air queen, twin pair</span><div class="spacer"></div><button class="btn small" id="btn-add-room">+ room</button></div>
        <div class="scroll"><table id="rooms-editor" class="tight"></table></div>
      </div>
      <div class="card">
        <div class="row"><h2>People</h2><span class="mono muted">flex = earlier sign-up in first come</span><div class="spacer"></div><button class="btn small" id="btn-add-person">+ person</button></div>
        <div class="scroll"><table id="people-editor" class="tight"></table></div>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-model">
    <div class="card" id="model"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highs@1.15.3/build/highs.js"></script>
<script src="model.js"></script>
<script src="outcomes.js"></script>
<script src="simulate.js"></script>
<script src="defaults.js"></script>
<script src="app.js"></script>
</body>
</html>
